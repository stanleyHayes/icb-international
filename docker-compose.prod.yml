# Full-stack compose for a self-contained ICB deployment: api + the three Next.js apps
# + MongoDB (single-node replica set).
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets have no defaults — compose refuses to start until they are exported (see the
# Security section of .env.example for how to generate each one). Everything else mirrors
# .env.example with container-network values.
#
# This is still the simulation: ICB_SIMULATION_ACKNOWLEDGED=true is the explicit nod that
# no real money moves, required before the API will boot with NODE_ENV=production.

name: icb-prod

services:
  mongo:
    image: mongo:8
    container_name: icb-prod-mongo
    restart: unless-stopped
    command: ['mongod', '--replSet', 'icb-rs', '--bind_ip_all', '--port', '27017']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Initialises the replica set once, then exits. Idempotent — safe to re-run. The member
  # is advertised as mongo:27017, so every client URI must keep directConnection=true.
  mongo-init:
    image: mongo:8
    container_name: icb-prod-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initialised");
          } catch (error) {
            rs.initiate({ _id: "icb-rs", members: [{ _id: 0, host: "mongo:27017" }] });
            print("replica set initiated");
          }
        '


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: icb/api:latest
    container_name: icb-prod-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${API_PORT:-4100}:4100'
    environment:
      NODE_ENV: production
      API_PORT: '4100'
      API_HOST: 0.0.0.0
      LOG_LEVEL: info
      MONGO_URI: mongodb://mongo:27017/icb?replicaSet=icb-rs&directConnection=true
      # Secrets — required, no defaults. Export them before `up`.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?export JWT_ACCESS_SECRET first}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?export JWT_REFRESH_SECRET first}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?export FIELD_ENCRYPTION_KEY first}
      COOKIE_SECRET: ${COOKIE_SECRET:?export COOKIE_SECRET first}
      JWT_ACCESS_TTL_SECONDS: '900'
      JWT_REFRESH_TTL_SECONDS: '604800'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://localhost:3101,http://localhost:3102}
      # Recording fakes bind when these are empty; set real keys to deliver mail/media.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ICB <no-reply@icb.example>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@icb.example}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-icb}
      CLOUDINARY_SIGNED_URL_TTL_SECONDS: '300'
      BANK_NAME: ${BANK_NAME:-ICB International Commercial Bank}
      BANK_BIC: ${BANK_BIC:-ICBKGHAC}
      BANK_COUNTRY: ${BANK_COUNTRY:-GH}
      BANK_SORT_CODE: ${BANK_SORT_CODE:-60-16-13}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-UTC}
      SIMULATION_ENABLED: 'true'
      SIMULATION_SEED: ${SIMULATION_SEED:-icb-default-seed}
      ICB_SIMULATION_ACKNOWLEDGED: 'true'
    # The Dockerfile carries a liveness HEALTHCHECK on /health; /health/ready (Mongo)
    # is what an orchestrator should gate traffic on.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4100/v1}
        NEXT_PUBLIC_MARKETING_URL: ${PUBLIC_MARKETING_URL:-http://localhost:3100}
        NEXT_PUBLIC_CLIENT_URL: ${PUBLIC_CLIENT_URL:-http://localhost:3101}
        NEXT_PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3102}
    image: icb/marketing:latest
    container_name: icb-prod-marketing
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '${MARKETING_PORT:-3100}:3100'

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4100/v1}
        NEXT_PUBLIC_MARKETING_URL: ${PUBLIC_MARKETING_URL:-http://localhost:3100}
        NEXT_PUBLIC_CLIENT_URL: ${PUBLIC_CLIENT_URL:-http://localhost:3101}
        NEXT_PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3102}
    image: icb/client:latest
    container_name: icb-prod-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '${CLIENT_PORT:-3101}:3101'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4100/v1}
        NEXT_PUBLIC_MARKETING_URL: ${PUBLIC_MARKETING_URL:-http://localhost:3100}
        NEXT_PUBLIC_CLIENT_URL: ${PUBLIC_CLIENT_URL:-http://localhost:3101}
        NEXT_PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3102}
    image: icb/admin:latest
    container_name: icb-prod-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '${ADMIN_PORT:-3102}:3102'

volumes:
  mongo-data:
