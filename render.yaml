# ─────────────────────────────────────────────────────────────────────────────
#  ICB International Commercial Bank — Render Blueprint
#
#  External services (not managed by this blueprint):
#    • MongoDB Atlas — must be a replica set; standalone disables transactions
#
#  The API has no Redis dependency: the cache is in-process and the approved-
#  postings sweep is an interval rather than a BullMQ job. MongoDB is the only
#  datastore.
#
#  The web service declares no ipAllowList — Render gates that behind an
#  Enterprise workspace plan and rejects the blueprint outright when present.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: icb-api
    runtime: node
    repo: https://github.com/stanleyHayes/icb-international
    branch: main
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /health/ready

    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "./packages/**" build && pnpm --filter @icb/api build
    startCommand: node apps/api/dist/main.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info

      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Must be 64 hex chars (32 bytes) — Render's generateValue emits base64,
      # so paste the value from apps/api/.env.production instead.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://icbinternationalcommercial.com,https://www.icbinternationalcommercial.com,https://client.icbinternationalcommercial.com,https://admin.icbinternationalcommercial.com
      - key: ICB_SIMULATION_ACKNOWLEDGED
        value: "true"
      - key: SIMULATION_ENABLED
        value: "true"
      - key: SIMULATION_SEED
        value: icb-default-seed
      - key: INITIAL_ADMIN_EMAIL
        value: root@icbinternationalcommercial.com
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ICB <no-reply@icbinternationalcommercial.com>
      - key: EMAIL_REPLY_TO
        value: support@icbinternationalcommercial.com
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: icb
      - key: CLOUDINARY_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: BANK_NAME
        value: ICB International Commercial Bank
      - key: BANK_BIC
        value: ICBKGHAC
      - key: BANK_COUNTRY
        value: GH
      - key: BANK_SORT_CODE
        value: 60-16-13
      - key: BASE_CURRENCY
        value: USD
      - key: BUSINESS_TIMEZONE
        value: UTC
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_SERVICE_NAME
        value: icb-api
      - key: BACKGROUND_JOBS_ENABLED
        value: "true"
