name: icb

services:
  # MongoDB must run as a replica set even locally: multi-document transactions are how the
  # double-entry ledger stays consistent, and a standalone mongod cannot start one.
  mongo:
    image: mongo:8
    container_name: icb-mongo
    restart: unless-stopped
    command: ['mongod', '--replSet', 'icb-rs', '--bind_ip_all', '--port', '27017']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
      - ./tools/scripts/mongo-init-replica.js:/docker-entrypoint-initdb.d/00-replica.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Initialises the replica set once, then exits. Idempotent — safe to re-run.
  mongo-init:
    image: mongo:8
    container_name: icb-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initialised");
          } catch (error) {
            rs.initiate({ _id: "icb-rs", members: [{ _id: 0, host: "localhost:27017" }] });
            print("replica set initiated");
          }
        '


  mongo-express:
    image: mongo-express:1
    container_name: icb-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${MONGO_EXPRESS_PORT:-8081}:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=icb-rs
      ME_CONFIG_BASICAUTH: 'false'
    profiles: ['tools']

volumes:
  mongo-data:
